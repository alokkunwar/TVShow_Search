<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Show Search</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#212529] text-white">

    <div class="container mx-auto p-5">
        <h1 class="text-3xl font-bold text-center mb-5">TV Show Search</h1>

        <!-- Search Box with Clear Button -->
        <div class="flex justify-center mb-5 relative w-full">
            <input type="text" id="searchInput" placeholder="Search TV Shows..."
                class="w-1/2 p-3 rounded-md text-black focus:outline-none">
            <button id="clearSearch" class="absolute right-[26%] bg-[#ced4da] text-black mt-2 px-3 py-1 rounded-md hidden">
                X
            </button>
        </div>

        <!-- Loading Spinner (Hidden by default) -->
        <div id="loading" class="hidden text-center">Loading...</div>

        <!-- Error Message (Shown when no results are found) -->
        <div id="error" class="hidden text-center text-red-500">No results found!</div>

        <!-- Container for displaying search results -->
        <div id="results" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    </div>

    <!-- Modal for displaying show details -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-[#343a40] p-5 rounded-lg shadow-lg max-w-lg w-full relative overflow-y-auto max-h-[80vh]">
            <!-- Close Button -->
            <button id="closeModal" class="absolute top-2 right-2 text-white text-xl">&times;</button>
            <img id="modalImage" class="w-full h-64 object-contain rounded-md">
            <h2 id="modalTitle" class="text-2xl font-bold mt-2"></h2>
            <p id="modalRating" class="text-gray-400 mt-1"></p>
            <p id="modalGenres" class="text-gray-400 mt-1"></p>
            <p id="modalPremiered" class="text-gray-400 mt-1"></p>
            <p id="modalSummary" class="text-gray-300 mt-2"></p>
            <a id="modalLink" class="mt-3 inline-block text-white hover:underline" target="_blank"></a>
        </div>
    </div>

    <!-- Include Axios for API requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Custom JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
